name: Update EPG

on:
  schedule:
    # 02:17 UTC every day (04:17/05:17 in Athens depending on DST)
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: epg-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and test
        run: |
          npm run typecheck
          npm test

      - name: Generate EPG
        run: npm run epg

      - name: Commit updated EPG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add epg
          if git diff --cached --quiet; then
            echo "EPG is unchanged."
            exit 0
          fi
          git commit -m "chore: update EPG $(date -u +%Y-%m-%d)"
          git push
